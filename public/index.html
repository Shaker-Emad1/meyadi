<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ميعادي · حجز مواعيد للمحلات الصغيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<link rel="manifest" href="/app.webmanifest">
</head>
<body>
<div class="hero"><div class="inner">
  <div class="brand">ميعادي</div>
  <h1>صفحة حجز لمحلك في 5 دقايق — مجانا</h1>
  <div class="meta"><span>عيادات · صالونات · كورسات · أي نشاط بمواعيد</span></div>
</div></div>
<div class="wrap single">
  <div class="card">
    <div class="sec">اعمل صفحة محلك</div>
    <div class="field"><label>اسم المحل</label><input id="name" placeholder="مثال: صالون النور"></div>
    <div class="field"><label>العنوان (اختياري)</label><input id="address"></div>
    <button class="btn" id="create">إنشاء الصفحة</button>
    <div class="msg" id="msg"></div>
    <div id="result" style="display:none">
      <pre class="rpt" id="links"></pre>
      <small style="color:var(--mut);font-weight:700">احفظ مفتاح الإدارة، مش هيبان تاني.</small>
    </div>
  </div>
  <div class="card"><div class="sec">جرب الديمو</div>
    <a class="btn ghost" href="/s/demo-salon/">صفحة حجز صالون النور (تجريبي)</a>
  </div>
</div>
<script>
document.getElementById('create').onclick=async()=>{
  const name=document.getElementById('name').value.trim();
  if(!name){const m=document.getElementById('msg');m.className='msg err';m.textContent='اكتب اسم المحل';return}
  const r=await fetch('/api/shops',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({name,address:document.getElementById('address').value})});
  const d=await r.json();
  if(!d.ok){const m=document.getElementById('msg');m.className='msg err';m.textContent=d.error;return}
  document.getElementById('result').style.display='block';
  document.getElementById('links').textContent='صفحة الحجز: '+location.origin+d.page+'\nلوحة التحكم: '+location.origin+d.admin;
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body></html>
